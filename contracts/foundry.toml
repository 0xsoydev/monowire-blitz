[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.22"

[rpc_endpoints]
monad_testnet = "https://testnet.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "verify", url = "https://testnet.monadvision.com/api" }

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true
